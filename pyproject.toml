[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oah-data-doctor"
version = "0.1.0"
description = "Deterministic scientific-integrity auditor for OneAquaHealth FHIR data: doctor, trace, compare, claim guardrail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "hypothesis>=6.100",
  "jsonschema>=4.21",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-PyYAML",
  "httpx2>=2",  # FastAPI's TestClient prefers it (otherwise a deprecation warning)
]
ai = ["anthropic>=0.40"]

[project.scripts]
datadoctor = "datadoctor.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
  "live: requires network access to the OAH sandbox (deselect with -m 'not live')",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP042"]  # UP042: str-mixin enums are deliberate (stable str()/JSON values with pydantic)

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["datadoctor"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.coverage.run]
source = ["datadoctor"]
omit = ["backend/datadoctor/api/*"]
