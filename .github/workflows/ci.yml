name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check backend scripts tools tasks.py
      - name: Mypy
        run: python -m mypy
      - name: Snapshot integrity (sha256 of every evidence file)
        run: python tools/oah_audit.py verify-snapshot
      - name: Tests (unit, property, contract, integration; offline)
        run: python -m pytest backend/tests -q --cov=datadoctor --cov-report=term-missing:skip-covered

  frontend:
    name: UI (typecheck, build, offline e2e + accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx tsc -p tsconfig.json
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright demo path and WCAG 2.1 AA checks (external network blocked in-page)
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "1"
