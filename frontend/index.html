<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="OAH Data Doctor checks whether published OneAquaHealth FHIR data makes scientific sense, and what can safely be concluded from it." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OAH Data Doctor</title>
    <script>
      // Pin the colour scheme before first paint (no flash). Default: dark, the scientific workstation look;
      // a user's choice (light, dark or system) is remembered.
      try {
        var t = localStorage.getItem("dd-theme") || "dark";
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="color-scheme"]').setAttribute("content", t);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
